<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>История операций пользователя</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style_user_operations.css') }}" />
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>

<body>
  <div class="container mt-5">
    <h1>История операций пользователя</h1>
        <form action="{{url_for('user_info')}}">
        <input type="submit" value="Информация о пользователе">
        </form>
        <form action="{{url_for('tariff_info')}}">
        <input type="submit" value="Тарифы">
        </form>
        <form action="{{url_for('user_operations')}}">
        <input type="submit" value="Операции">
        </form>
        <form action="{{url_for('user_control')}}">
        <input type="submit" value="Управление аккаунтом">
        </form>
    <div class="table-wrapper">
      <table class="table">
        <thead>
          <tr>
            <th>Дата</th>
            <th>Тип операции</th>
            <th>Сумма</th>
            <th>Остаток</th>
          </tr>
        </thead>
        <tbody>
            {% for row in data%}
          <tr>
            <td>{{row['OPERATION_DATA']}}</td>
            <td>{{row['OPERATION_TYPE']}}</td>
            <td>{{row['OPERATION_SUM']}}</td>
            <td>{{row['OPERATION_OSTATOK']}}</td>
          </tr>
            {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</body>

</html>
